# arguments for dataset
dataset: LEVIR-256
nclass: 2
crop_size: 256
data_root: /data_root

# arguments for training
batch_size: 1 # per GPU x 1 GPU


# arguments for model
model: deeplabv3plus
backbone: resnet50
replace_stride_with_dilation: [False, False, True]
dilations: [6, 12, 18]

